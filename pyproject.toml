[project]
name = "toto-scraper"
version = "0.1.0"
description = "DrawSense: Singapore TOTO results scraper and next-draw ranked sets (ML)"
readme = "README.md"
authors = [
    { name = "prabhu121995", email = "prabhurb95@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "catboost>=1.2.10",
    "fastapi>=0.163.2",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "lxml>=6.1.3",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "optuna>=5.1.0",
    "pandas>=3.1.1",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.4.1",
]

[project.scripts]
toto-scraper = "toto_scraper:main"
toto-ml = "toto_ml.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["toto_scraper", "toto_ml"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
